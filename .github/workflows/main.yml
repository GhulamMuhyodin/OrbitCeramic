name: Deploy Angular to Hostinger

# prod → domains/mediumvioletred-trout-528447.hostingersite.com/public_html/
# uat  → domains/uat.orbitceramic.studio/public_html/
on:
  push:
    branches:
      - prod
      - uat

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set deploy target
        id: target
        run: |
          case "${{ github.ref_name }}" in
            prod)
              SITE=LIVE
              DOMAIN=https://mediumvioletred-trout-528447.hostingersite.com
              DIR=domains/mediumvioletred-trout-528447.hostingersite.com/public_html/
              ;;
            uat)
              SITE=UAT
              DOMAIN=https://mediumvioletred-trout-528447.hostingersite.com
              DIR=domains/mediumvioletred-trout-528447.hostingersite.com/public_html/
              ;;
            *)
              echo "Unsupported branch: ${{ github.ref_name }}"
              exit 1
              ;;
          esac
          echo "site=$SITE" >> "$GITHUB_OUTPUT"
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Deploy ${{ github.ref_name }} ($SITE) → $DIR"

      - name: Install & build
        run: |
          npm ci
          npm run build
          test -f dist/OrbitCeramic/browser/index.html
          test -f dist/OrbitCeramic/browser/.htaccess
          echo "Build OK — $(find dist/OrbitCeramic/browser -type f | wc -l) files → ${{ steps.target.outputs.site }} (${{ steps.target.outputs.domain }})"

      - name: Deploy orbit-api to PHP folder
        if: ${{ github.ref_name == 'uat' || github.ref_name == 'prod' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          TIMESTAMP=$(date -u +'%Y%m%d-%H%M%S')
          TARGET_DIR="../${{ steps.target.outputs.dir }}"
          echo "Deploying orbit-api to PHP folder under $TARGET_DIR/php"

          lftp -u "u948222984","7hidSH$BE&=Fn@R" "ftp://185.224.137.128" <<'EOF'
          set ftp:ssl-allow no
          set cmd:fail-exit yes
          cd $TARGET_DIR
          cls -1 php
          bye
EOF
          if [ $? -eq 0 ]; then
            echo "Existing php folder found; moving to php-backup-$TIMESTAMP"
            lftp -u "u948222984","7hidSH$BE&=Fn@R" "ftp://185.224.137.128" <<EOF
            set ftp:ssl-allow no
            set cmd:fail-exit yes
            cd $TARGET_DIR
            mv php php-backup-$TIMESTAMP
            bye
EOF
          else
            echo "No existing php folder found; uploading fresh folder"
          fi

          lftp -u "u948222984","7hidSH$BE&=Fn@R" "ftp://185.224.137.128" <<EOF
          set ftp:ssl-allow no
          set cmd:fail-exit yes
          lcd orbit-api
          cd $TARGET_DIR
          mkdir -p php || true
          mirror -R . php --delete --verbose
          bye
EOF

      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: 185.224.137.128
          username: u948222984
          password: "7hidSH$BE&=Fn@R"
          local-dir: dist/OrbitCeramic/browser/
          # If File Manager shows files under public_html/public_html/,
          # change this to ./  (FTP account already starts in public_html)
          server-dir: ${{ steps.target.outputs.dir }}
          log-level: standard




