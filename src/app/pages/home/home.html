@if (content$ | async; as content) {
  <app-site-header [brand]="content.brand" [nav]="content.nav" [overlay]="false" />
  <main>
    <app-hero [content]="content.hero" [highlights]="content.heroHighlights" />
    <app-batch
      [content]="content.batch"
      [brand]="content.brand"
      [whatsapp]="content.contact.whatsapp"
      [timerOnly]="true"
    />
  </main>
  <app-site-footer
    [brand]="content.brand"
    [contact]="content.contact"
    [content]="content.footer"
  />
} @else {
  <div
    class="grid min-h-dvh place-items-center bg-surface font-body text-stone-700"
    role="status"
  >
    Loading Orbit Ceramic…
  </div>
}
