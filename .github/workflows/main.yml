name: Deploy Angular to Hostinger

# Website deploy:
#   Build  → dist/OrbitCeramic/browser/   (full ready website)
#   Upload → public_html/                 (same structure, site root)
# Example: browser/index.html → public_html/index.html
on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production website
        run: npm run build

      - name: Verify website root is ready
        run: |
          ROOT="dist/OrbitCeramic/browser"
          test -f "$ROOT/index.html"
          test -f "$ROOT/.htaccess"
          echo "Website root ($ROOT):"
          ls -la "$ROOT"

      - name: List files copying into public_html (website root)
        run: |
          echo "============================================================"
          echo "Created website folder : dist/OrbitCeramic/browser/"
          echo "Hostinger website root : public_html/"
          echo "Structure is copied 1:1 (same folders and file names)."
          echo "============================================================"
          cd dist/OrbitCeramic/browser
          find . -type f | sed 's|^\./||' | sort | while read -r file; do
            echo "  $file  ->  public_html/$file"
          done
          echo "------------------------------------------------------------"
          echo "Total files: $(find . -type f | wc -l)"
          echo "============================================================"

      - name: Copy website into public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: 185.224.137.128
          username: u948222984
          password: "7hidSH$BE&=Fn@R"
          # Ready website folder from Angular build
          local-dir: dist/OrbitCeramic/browser/
          # Hostinger site root — must match File Manager public_html
          server-dir: public_html/
          # Always refresh public_html with the new website build
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/cgi-bin/**
          log-level: verbose
