name: Deploy Angular to Hostinger

# Builds the site on CI, then uploads ONLY the static browser build
# (dist/OrbitCeramic/browser/*) into Hostinger public_html — not full source.
on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Verify browser build exists
        run: |
          test -f dist/OrbitCeramic/browser/index.html
          echo "Build output ready:"
          ls -la dist/OrbitCeramic/browser

      - name: Upload build to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # Host only — do not include ftp://
          server: 185.224.137.128
          username: u948222984
          # Quote password: unquoted & breaks YAML
          password: "7hidSH$BE&=Fn@R"
          local-dir: dist/OrbitCeramic/browser/
          # If File Manager shows files under public_html/public_html/,
          # change this to ./  (FTP account already starts in public_html)
          server-dir: ./domains/mediumvioletred-trout-528447.hostingersite.com/public_html/
          log-level: standard




