name: Deploy Angular to Hostinger

# Builds the site on CI, then uploads ONLY the static browser build
# (dist/OrbitCeramic/browser/*) into Hostinger public_html — not full source.
on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Verify browser build exists
        run: |
          test -f dist/OrbitCeramic/browser/index.html
          echo "Build output ready:"
          ls -la dist/OrbitCeramic/browser

      - name: List files that will copy into public_html
        run: |
          echo "============================================================"
          echo "SOURCE : dist/OrbitCeramic/browser/"
          echo "TARGET : public_html/"
          echo "============================================================"
          echo ""
          echo "Each line = file copied to Hostinger public_html:"
          echo ""
          cd dist/OrbitCeramic/browser
          find . -type f | sed 's|^\./||' | sort | while read -r file; do
            echo "  $file  ->  public_html/$file"
          done
          echo ""
          echo "Total files: $(find . -type f | wc -l)"
          echo "============================================================"

      - name: Upload build to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          # Host only — do not include ftp://
          server: 185.224.137.128
          username: u948222984
          # Quote password: unquoted & breaks YAML
          password: "7hidSH$BE&=Fn@R"
          local-dir: dist/OrbitCeramic/browser/
          # If files land in public_html/public_html/, change this to ./
          server-dir: public_html/
          # Wipe server-dir then upload fresh build (forces full replace)
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.htaccess
            **/cgi-bin/**
          # Shows creating/replacing/deleting for every file in the Action log
          log-level: verbose
