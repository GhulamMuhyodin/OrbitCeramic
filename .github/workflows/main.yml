name: Deploy Angular to Hostinger

# Branch → website mapping
#   prod → LIVE → https://orbitceramic.studio          → public_html/
#   uat  → UAT  → https://uat.orbitceramic.studio      → domains/uat.orbitceramic.studio/public_html/
#
# Build  → dist/OrbitCeramic/browser/  (ready website)
# Upload → that branch's public_html   (1:1 copy)
on:
  push:
    branches:
      - prod
      - uat

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Choose website target from branch
        id: target
        run: |
          BRANCH="${{ github.ref_name }}"
          case "$BRANCH" in
            prod)
              echo "site=LIVE" >> "$GITHUB_OUTPUT"
              echo "label=Production (live website)" >> "$GITHUB_OUTPUT"
              echo "domain=https://orbitceramic.studio" >> "$GITHUB_OUTPUT"
              # Main domain website root on Hostinger
              echo "dir=public_html/" >> "$GITHUB_OUTPUT"
              ;;
            uat)
              echo "site=UAT" >> "$GITHUB_OUTPUT"
              echo "label=UAT (staging website)" >> "$GITHUB_OUTPUT"
              echo "domain=https://uat.orbitceramic.studio" >> "$GITHUB_OUTPUT"
              # Change this path if Hostinger File Manager shows a different UAT folder
              echo "dir=domains/uat.orbitceramic.studio/public_html/" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported branch: $BRANCH"
              exit 1
              ;;
          esac

      - name: Show deploy identity
        run: |
          echo "============================================================"
          echo "Branch  : ${{ github.ref_name }}"
          echo "Site    : ${{ steps.target.outputs.site }}"
          echo "Label   : ${{ steps.target.outputs.label }}"
          echo "Domain  : ${{ steps.target.outputs.domain }}"
          echo "FTP dir : ${{ steps.target.outputs.dir }}"
          echo "============================================================"

      - name: Install dependencies
        run: npm ci

      - name: Build production website
        run: npm run build

      - name: Verify website root is ready
        run: |
          ROOT="dist/OrbitCeramic/browser"
          test -f "$ROOT/index.html"
          test -f "$ROOT/.htaccess"
          echo "Website root ($ROOT):"
          ls -la "$ROOT"

      - name: List files copying into website folder
        run: |
          TARGET="${{ steps.target.outputs.dir }}"
          echo "============================================================"
          echo "SOURCE : dist/OrbitCeramic/browser/"
          echo "TARGET : $TARGET"
          echo "Site   : ${{ steps.target.outputs.site }} (${{ github.ref_name }})"
          echo "Domain : ${{ steps.target.outputs.domain }}"
          echo "============================================================"
          cd dist/OrbitCeramic/browser
          find . -type f | sed 's|^\./||' | sort | while read -r file; do
            echo "  $file  ->  ${TARGET}${file}"
          done
          echo "------------------------------------------------------------"
          echo "Total files: $(find . -type f | wc -l)"
          echo "Open site  : ${{ steps.target.outputs.domain }}"
          echo "============================================================"

      - name: Copy website to Hostinger (${{ steps.target.outputs.site }})
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: 185.224.137.128
          username: u948222984
          password: "7hidSH$BE&=Fn@R"
          local-dir: dist/OrbitCeramic/browser/
          server-dir: ${{ steps.target.outputs.dir }}
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/cgi-bin/**
          log-level: verbose
